    <script th:inline="javascript">
        var people = [];
/*<![CDATA[*/
people = /*[[${people}]]*/ 'default';
/*]]>*/
        var fatherList = [];
var printed = 0;
  for(var p in people){
         if (people[p].gender === "MALE" || people[p].gender === null || people[p].gender === "OTHER") {
            fatherList.push({value: people[p].id, firstName: people[p].firstName.trim(), middleName: people[p].middleName.trim(), 
              lastName: people[p].lastName.trim(), generation: people[p].generation.trim(), nickName: people[p].nickName.trim(),
              label: people[p].firstName.trim() + " " + people[p].lastName.trim() + " " + people[p].nickName.trim()
            });
         }
  }
        $(function() {
          $("#father").autocomplete({
            minLength: 2,                                                                                     
            source: fatherList,
            focus: function (event, ui) {
              //$(".autoc #parentSearch").val(ui.item.label);
              $(".autoc").val(ui.item.label);
              return false;
            },
            select: function (event, ui) {
              $("#father-firstName").val(ui.item.firstName);
              $("#father-id").val(ui.item.value);
              $("#father-middleName").val(ui.item.middleName);
              $("#father-lastName").val(ui.item.lastName);
              $("#father-generation").val(ui.item.generation);
              $("#father-nickName").val(ui.item.nickName);
              return false;
            },
          })
          .autocomplete("instance")._renderItem = function (ul, item) {
          return $("<li>")
            .append("<div>" + item.firstName + ((item.middleName == "" ? "" : " " + item.middleName)) 
                  + " " + item.lastName + ((item.nickName == "" ? "" : " \"" + item.nickName + "\"")) + 
                  ((item.generation == "" ? "" : " " + item.generation)) + "</div>")
            .appendTo(ul);
        };
      });
    </script>

  <body>

      <div class="container">
      <form id="person-form" action="#" th:action="@{/familytree/person/add}" th:object="${person}" method="POST">
        
        <button type="submit" class="btn btn-secondary col-2">Save Person</button>
      <a th:href="@{/familytree/person/personList}">Back to Person List</a>

          <table class="table table-bordered table-striped table-sm">
            <thead class="table-dark">
              <tr>
                <th>First Name</th>
                <th>Middle Name</th>
                <th>Last Name</th>
                <th>Generation</th>
                <th>Married Name</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td>
                  <input
                    type="text"
                    th:field="${person.firstName}"
                    class="form-control mb-0 w-100"
                    placeholder="First Name"
                  />
                </td>

                <td>
                  <input
                    type="text"
                    th:field="${person.middleName}"
                    class="form-control mb-0 w-100"
                    placeholder="Middle Name"
                  />
                </td>
                <td>
                  <input
                    type="text"
                    th:field="${person.lastName}"
                    class="form-control mb-0 w-100"
                    placeholder="Last Name"
                  />
                </td>
                <td>
                  <input
                    type="text"
                    th:field="${person.generation}"
                    class="form-control mb-0 w-100"
                    placeholder="Jr., Sr., II, etc."
                  />
                </td>
                <td>
                  <input
                    type="text"
                    th:field="${person.marriedName}"
                    class="form-control mb-0 w-100"
                    placeholder="Married Name"
                  />
                </td>
              </tr>
            <tr>
              <td>
                <input type="text"
                  th:field="${person.nickName}"
                  class="form-control mb-0 w-100"
                  placeholder="Nickname"
                />
              </td>
              <td colspan="3"</td>
              <td>
                <!-- <input type="text" -->
                <!--   th:field="${person.gender}" -->
                <!--   class="form-control mb-0 w-100" -->
                <!--   placeholder="Gender" -->
                <!-- /> -->
                <select th:field="${person.gender}"
                  class="form-control mb-0 w-100"
                  placeholder="Gender"
                >
                  <option value="MALE">Male</option>
                  <option value ="FEMALE">Female</option>
                  <option value="OTHER">Other</option>
                </select>
              </td>
            </tr>

            </tbody>
          </table>
        
          <table class="table table-bordered table-striped">
            <thead class="table-dark">
              <tr>
                <th colspan="3">Current Location</th>
              <th>
    <input class="w-100" id="location" placeholder="Search Current Location"/>
                <input type="hidden" id="location-id" th:field="${person.personCurrentLocationId}"/>
              </th>             
              </tr>
          </thead>
            <tbody>
              <tr>
                <td colspan="4">
                  <input
                    type="text" id="location-address1"
                    th:field="${currentLocation.locationAddress1}"
                    class="form-control mb-0 w-100"
                    placeholder="Address Line 1"
                  />
                </td>
                </tr>
              <tr>
                <td colspan="4">
                  <input
                    type="text" id="location-address2"
                    th:field="${currentLocation.locationAddress2}"
                    class="form-control mb-0 w-100"
                    placeholder="Address Line 2"
                  />
                </td>
                </tr>
              <tr>
                <td>
                  <input
                    type="text" id="location-city"
                    th:field="${currentLocation.locationCity}"
                    class="form-control mb-0 w-100"
                    placeholder="City"
                  />
                </td>
                <td>
                  <input
                    type="text" id="location-county"
                    th:field="${currentLocation.locationCounty}"
                    class="form-control mb-0 w-100"
                    placeholder="County"
                  />
                </td>
                <td>
                  <input
                    type="text" id="location-state"
                    th:field="${currentLocation.locationState}"
                    class="form-control mb-0 w-100"
                    placeholder="State"
                  />
                <input type="hidden" id="location-stateShort"
                  th:field="${currentLocation.locationStateShort}"
                />
                </td>
              <td>
                <input
                  type="text" id="location-zip"
                  th:field="${currentLocation.locationZip}"
                  class="form-control mb-0 w-100"
                  placeholder="Zipcode"
                />
              </td>
            </tr>
            <tr>
              <td colspan=3></td>
                <td>
                  <input
                    type="text" id="location-country" list="countrySearchList"
                    th:field="${currentLocation.locationCountry.countryName}"
                    class="form-control mb-0 w-100"
                    placeholder="Country"
                  />
                <datalist id="countrySearchList"></datalist>
                <input type="hidden" id="location-countryId"
                  th:field="${currentLocation.locationCountry.id}"
                />
                </td>
                </tr>
              </tbody>
        </table>

          <table class="table table-bordered table-striped">
            <thead class="table-dark">
              <tr>
                <th colspan="4">Birth</th>
              </tr>

              <tr>

                </td>
                <td>

                    placeholder="State"
                  />
                  <input type="hidden" id="birthLocation-stateShort"
                    th:field="${birth.birthLocation.locationStateShort}"

                    placeholder="Country"
                  />
                <datalist id="countrySearchList"></datalist>

                  <input type="hidden" id="birthLocation-countryId"
                    th:field="${birth.birthLocation.locationCountry.id}"
                  />
                </td>
                </tr>
              </tbody>
            </thead>
        </table>

            </thead>

            <tbody>
              <tr>
                <td>
                
                    <input type="text" id="father-firstName"
                    th:field="${person.father.firstName}"
                    class="form-control mb-0 w-100"
                    placeholder="First Name" readonly
                  />
                </td>

                <td>
                  <input
                    type="text" id="father-middleName"
                    th:field="${person.father.middleName}"
                    class="form-control mb-0 w-100"
                    placeholder="Middle Name" readonly
                  />
                </td>
                <td>
                  <input
                    type="text" id="father-lastName"
                    th:field="${person.father.lastName}"
                   class="form-control mb-0 w-100"
                    placeholder="Last Name" readonly
                  />
                </td>
                <td>
                  <input
                    type="text" id="father-generation"
                    th:field="${person.father.generation}"
                    class="form-control mb-0 w-100"
                    placeholder="Jr., Sr., II, etc." readonly
                  />
                </td>
              </tr>
            </tbody>
          </table>

          <table class="table table-borderless table-striped">
            <thead class="table-dark">
            <tr>
              <th colspan="3">Mother</th>
              <th>
    <input class="w-100" id="mother" placeholder="Search Mother"/>
                <input type="hidden" id="mother-id" th:field="${person.motherId}"/>
              </th>             

            </tr>
              <tr>
                <th>First Name</th>
                <th>Middle Name</th>
                <th>Last Name</th>
                <th>Married Name</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td>
                  <input
                    type="text" id="mother-firstName"
                    th:field="${person.mother.firstName}"
                    class="form-control mb-0 w-100"
                    placeholder="First Name" readonly
                  />
                </td>

                <td>
                  <input
                    type="text" id="mother-middleName"
                    th:field="${person.mother.middleName}"
                    class="form-control mb-0 w-100"
                    placeholder="Middle Name" readonly
                  />
                </td>
                <td>
                  <input
                    type="text" id="mother-lastName"
                    th:field="${person.mother.lastName}"
                    class="form-control mb-0 w-100"
                    placeholder="Last Name" readonly
                  />
                </td>
                <td>
                  <input
                    type="text" id="mother-marriedName"
                    th:field="${person.mother.marriedName}"
                    class="form-control mb-0 w-100"
                    placeholder="Married Name" readonly
                  />
                </td>
              </tr>
            </tbody>
          </table>

          <table class="table table-borderless table-striped">
            <thead class="table-dark">
            <tr>
              <th colspan="3">Marriage</th>
              <th>
    <input class="w-100" id="spouse" placeholder="Search Spouse"/>
                <input type="hidden" id="spouse-id" 
                  th:field="${personMarriage.spouse2Id}"/>
              </th>             

            </tr>
              <tr>
                <th>First Name</th>
                <th>Middle Name</th>
                <th>Last Name</th>
                <th>Relationship</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td>
                  <input
                    type="text" id="spouse-firstName"
                    class="form-control mb-0 w-100"
                    placeholder="First Name" readonly
                  >
                </td>

                <td>
                  <input
                    type="text" id="spouse-middleName"
                    class="form-control mb-0 w-100"
                    placeholder="Middle Name" readonly
                  >
                </td>
              <td>
                 <input
                    type="text" id="spouse-lastName"
                    class="form-control mb-0 w-100"
                    placeholder="Last Name" readonly
                  >
                </td>
                <td>
                <select th:field="${marriage.marriageStatus}"
                  class="form-control mb-0 w-100"
                  placeholder="Gender"
                >
                  <option value="MARRIED">Married</option>
                  <option value ="PARTNERED">Partnered</option>
                  <option value="SEPARATED">Separated</option>
                  <option value ="DIVORCED">Divorced</option>
                  <option value="OTHER">Other</option>
                  <option value="UNKNOWN">Unknown</option>
                </select>

                </td>
              </tr>
            <tr>
                <td>
                  <input
                    type="number"
                    th:field="${marriage.marriageYear}"
                    class="form-control mb-0 w-100"
                    placeholder="Year YYYY"
                  />
                </td>
                <td>
                  <input
                    type="number" min="1" max="12"
                    th:field="${marriage.marriageMonth}"
                    class="form-control mb-0 w-100"
                    placeholder="Month"
                  />
                </td>
                <td>
                  <input
                    type="number" min="1" max="31"
                    th:field="${marriage.marriageDay}"
                    class="form-control mb-0 w-100"
                    placeholder="Day"
                  />
                </td>
            </tr>
            </tbody>
          </table>
          <table class="table table-borderless table-striped">
            <thead class="table-dark">
            <tr>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>
<textarea 
                id="person-notes"
                th:field="${person.personNotes}"
                class="form-control mb-0 w-100"
                  rows="5"
                  placeholder="Enter notes here..."
              />
              </td>
            </tr>

          </tbody>
        </table> 
        <button type="submit" class="btn btn-secondary col-2">Save Person</button>

      <a th:href="@{/familytree/person/personList}">Back to Person List</a>

        </form>
      </div>

      <hr />
    </div>
  </body>
  </html>
